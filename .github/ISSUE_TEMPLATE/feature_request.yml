name: ✨ Feature request
description: Suggest an idea or improvement
title: "✨ "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describing the **problem** first helps more than jumping to a solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I want to export my mood recommendations directly to another service.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Add an export button on the track results header.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would really help
        - Blocking me
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md)

